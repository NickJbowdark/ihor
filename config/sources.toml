# GIM SOURCE REGISTRY -- the single place where every source is described.
#
# This is your *collection plan*. Each [[source]] says WHAT the source is, WHO
# publishes it, HOW we may access it, and HOW OFTEN. Operational state (last
# success, last error, status) is NOT stored here: it lives in the database
# table `source_status` and is shown on the dashboard's "Source health" page.
#
# Fields
#   id            short unique key (letters, digits, underscore)
#   name          display name
#   organization  publishing organisation
#   category      news_discovery | international_media | official_eu | official_un |
#                 official_nato | official_national | conflict_dataset | humanitarian |
#                 economic | sanctions | geospatial
#   doc_type      default type of documents from this source:
#                 original_reporting | syndicated | official_statement | dataset_record |
#                 analysis_opinion | unknown
#   connector     gdelt | rss | reliefweb | planned   (planned = catalogued, no code yet)
#   url           feed / API endpoint actually requested
#   homepage      human-readable site
#   coverage      geographic coverage (free text)
#   languages     ISO 639-1 codes
#   default_regions  regions assigned when no place name is recognised in a document
#   auth          none | appname | token | oauth
#   auth_env      names of .env variables holding credentials (never the secrets themselves)
#   licence       licence / terms summary  (OUR READING -- always check the source's own terms)
#   usage_notes   access etiquette and analytical caveats
#   poll_minutes  minimum minutes between collection runs
#   enabled       collect automatically?
#
# VERIFICATION is not declared here. It is recorded by `python -m gim.validate`
# (schema + document-quality checks against a real response) and shown on the
# Source health page with its date.
#
# NOTE: there is deliberately NO "reliability score" field. Reliability is assessed
# per claim / per event (evidence, independence, attribution), not per organisation.

# ---------------------------------------------------------------------------
# PRIORITY 1 -- discovery
# ---------------------------------------------------------------------------
[[source]]
id = "gdelt"
name = "GDELT DOC 2.0 (article search)"
organization = "The GDELT Project"
category = "news_discovery"
doc_type = "unknown"     # GDELT cannot tell original from syndicated reporting
connector = "gdelt"
url = "https://api.gdeltproject.org/api/v2/doc/doc"
homepage = "https://www.gdeltproject.org/"
coverage = "Global, ~65 languages (machine-translated search)"
languages = ["multi"]
default_regions = []
auth = "none"
auth_env = []
licence = "Free; metadata may be used with attribution to GDELT. Linked articles remain the publishers' copyright."
usage_notes = "Discovery only, NOT verification. Max ~1 request / 5 s. Rolling ~3-month window. sourcecountry = outlet country, not event location."
poll_minutes = 180
enabled = true

