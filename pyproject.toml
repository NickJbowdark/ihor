[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gim"
version = "0.3.0"
description = "Global Intelligence Monitor - a personal geopolitical OSINT platform"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pandas>=2.1",
    "streamlit>=1.50",
    "plotly>=5.20",
    "feedparser>=6.0",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gim-ingest = "gim.ingest:main"
gim-collect = "gim.collect:main"
gim-report = "gim.report:main"
gim-validate = "gim.validate:main"
gim-alerts = "gim.alerts:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gim.reports" = ["fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
